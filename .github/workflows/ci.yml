name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一分支的新提交直接取消上一轮，省 runner 时间也避免「旧提交红灯」误导
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: 静态检查 / 单测 / 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 不写 version：pnpm/action-setup 会读 package.json 的 packageManager 字段，
      # 保证 CI 与本地用同一个 pnpm（9.15.0），不出现「本地能装、CI 装出别的树」
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 顺序即失败速度：类型 → lint → 覆盖率门禁 → 构建
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run test:coverage
      - run: pnpm run build

  e2e:
    name: 端到端（Chromium）
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # playwright.config.ts 用的是 channel: "chrome"（复用已安装的 Chrome，不下载内核）；
      # ubuntu-latest 镜像自带 Google Chrome，所以这里不需要 playwright install。
      # 若哪天换成 bundled chromium，这里要补 `pnpm exec playwright install --with-deps chromium`。
      # 日志要登录才能看，但注解是公开的：JSON 报告 → 每条失败一行 ::error::
      # 顺带把失败用例写进 job summary，PR 页面直接可读
      - name: 端到端测试
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/results.json
        run: pnpm exec playwright test --reporter=list,json

      - name: 失败用例转成注解
        if: failure()
        run: node scripts/e2e-annotate.mjs

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7

  perf:
    name: 性能预算
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 与线上一致走默认 webpack 构建（不是 --turbopack）
      - run: pnpm run build

      # 探针自己会从 shots/ 复制一张大图当压力壁纸，不需要额外准备素材
      - name: 采集并断言预算
        run: |
          set -euo pipefail
          pnpm exec next start --port 3100 > perf-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

          ready=0
          for i in $(seq 1 45); do
            if curl -sf -o /dev/null http://127.0.0.1:3100/; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then
            echo "::error::next start 未在 90s 内就绪"
            tail -40 perf-server.log
            exit 1
          fi

          node scripts/perf-probe.mjs --budget

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: perf-probe-output
          path: |
            perf-report.json
            perf-server.log
            public/__perf-bg.png
          retention-days: 3
